<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09030a">
<meta name="robots" content="noindex, nofollow, nosnippet">
<title>Для тебя</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="red">
<canvas id="galaxy" aria-hidden="true"></canvas>
<canvas id="universe" aria-hidden="true"></canvas>
<canvas id="heartLayer" aria-hidden="true"></canvas>
<p class="sr-only" id="audioStatus" role="status" aria-live="polite"></p>
<main>
<section id="welcome" class="welcome">
<div class="invitation">
<span class="eyebrow">Тебе, с любовью</span>
<h1>Моя вселенная<br>это <em>ты.</em></h1>
<div class="illustration"><img src="assets/embrace.webp" alt="Два нежных медвежонка обнимаются"></div>
<p id="dedication">Среди миллиардов звёзд<br>я всё равно выберу тебя.</p>
<button id="openButton" class="primary">Заглянуть внутрь</button>
</div>
</section>
<section id="scene" class="scene" tabindex="-1" aria-label="Моя вселенная" hidden>
<div class="scene-heading"><span class="eyebrow">В КАЖДОЙ МОЕЙ ВСЕЛЕННОЙ</span><h2 id="sceneTitle">Я люблю тебя</h2><p>И всё здесь немного о нас.</p></div>
<div id="memories" aria-label="Наши маленькие истории"></div>
</section>
</main>
<dialog id="accessDialog" class="access-dialog" aria-labelledby="accessTitle" aria-describedby="accessDescription">
<form id="accessForm">
<img class="access-art" src="assets/heart.webp" alt="" aria-hidden="true">
<span class="eyebrow">ОДНА ОСОБЕННАЯ ВСЕЛЕННАЯ</span>
<h2 id="accessTitle">Только для тебя</h2>
<p id="accessDescription">У этой вселенной есть маленький секрет.</p>
<label for="passwordInput" class="sr-only">Пароль</label>
<div class="password-field"><input id="passwordInput" type="password" required autocomplete="off" placeholder="Введи наш маленький секрет"><button id="showPasswordButton" type="button" aria-label="Показать пароль"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<p id="accessError" class="access-error" role="alert"></p>
<button id="accessSubmit" class="primary" type="submit">Войти во вселенную</button>
</form>
</dialog>
<dialog id="memoryDialog" class="memory-dialog" aria-labelledby="memoryTitle" aria-describedby="memoryText">
<button class="close" data-close aria-label="Закрыть">×</button>
<div id="memoryContent"><span class="memory-caption" id="memoryCaption"></span><h2 id="memoryTitle"></h2><p id="memoryText"></p><div id="memoryArt" class="memory-media"></div><p id="memoryMediaStatus" class="media-status" role="status" aria-live="polite"></p></div>
</dialog>
<script src="scene-math.js"></script>
<script src="galaxy-renderer.js"></script>
<script src="content.js"></script>
<script src="memory-media.js"></script>
<script src="glyph-renderer.js"></script>
<script src="app.js"></script>
</body>
</html>
